[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "iqoptions-ai-trading-platform"
version = "0.1.0"
description = "Production-oriented AI trading research platform with paper-trading-first architecture."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.14,<2.0",
  "redis>=5.0,<6.0",
  "celery>=5.4,<6.0",
  "structlog>=24.4,<26.0",
  "prometheus-fastapi-instrumentator>=7.0,<8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
  "pre-commit>=4.0,<5.0",
]
ai = [
  "numpy>=2.1,<3.0",
  "pandas>=2.2,<3.0",
  "scikit-learn>=1.5,<2.0",
  "xgboost>=2.1,<3.0",
  "lightgbm>=4.5,<5.0",
  "optuna>=4.0,<5.0",
  "pandas-ta>=0.3.14b0",
  "torch>=2.5,<3.0",
  "tensorflow>=2.18,<3.0",
]
telegram = ["python-telegram-bot>=21.7,<22.0"]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
